services:
  mongodb:
    image: mongo:7
    container_name: stockflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - stockflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stockflow-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/stockflow
      - JWT_SECRET=stockflow_super_secret_jwt_key_for_docker_deployment
      - JWT_EXPIRES_IN=1d
      - CLIENT_ORIGIN=http://localhost:5173,http://localhost:80,http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stockflow-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stockflow-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - stockflow-network

volumes:
  mongo_data:

networks:
  stockflow-network:
    driver: bridge
